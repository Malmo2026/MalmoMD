<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Temporarily Unavailable</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 520px;
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      color: #111827;
    }

    p {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Website Temporarily Unavailable</h1>
    <p>
      This website is currently unavailable. Please check back again later.
    </p>
  </div>
</body>
</html>
